name: release

# Tag a version to publish:   git tag v2.1.0 && git push origin v2.1.0
# Builds a self-contained win-x64 zip (+ SHA-256) and attaches both to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Test + publish win-x64
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?)$') { $version = $Matches[1] }
          elseif ("${{ github.ref_type }}" -eq 'tag') { throw "Tag '$tag' is not a valid version tag (expected vMAJOR.MINOR.PATCH[-suffix])" }
          else { $version = "0.0.0-dev"; $tag = "dev" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: dotnet restore TransparentNotepad.sln
      - run: dotnet build TransparentNotepad.sln -c Release --no-restore -warnaserror
      - run: dotnet test TransparentNotepad.sln -c Release --no-build --verbosity normal    # both test projects
      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/TransparentNotepad/TransparentNotepad.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -warnaserror -p:Version=${{ steps.ver.outputs.version }} -o publish/win-x64
      - name: Strip non-x64 runtimes, package, checksum
        shell: pwsh
        run: |
          if (Test-Path publish/win-x64/runtimes) {
            Get-ChildItem publish/win-x64/runtimes -Directory | Where-Object { $_.Name -ne 'win-x64' } | Remove-Item -Recurse -Force
          }
          $name = "TransparentNotepad-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: TransparentNotepad-win-x64
          path: |
            TransparentNotepad-*.zip
            TransparentNotepad-*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
